:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mute:#5b6783;--line:#e3e8f2;--brand:#1d3a8a;--brand2:#3b6fd8;--chip:#eef2fb;--hover:#f3f6fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#161e33;--ink:#e8ecf7;--mute:#9aa6c4;--line:#26314e;--brand:#7ea2f5;--brand2:#4f7de0;--chip:#1f2a48;--hover:#1b2542;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#161e33;--ink:#e8ecf7;--mute:#9aa6c4;--line:#26314e;--brand:#7ea2f5;--brand2:#4f7de0;--chip:#1f2a48;--hover:#1b2542;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.hero{background:linear-gradient(135deg,#14307a,#2f63c9);color:#fff;padding:28px 20px 64px}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero h1{margin:0;font-size:26px;letter-spacing:.2px}
.hero p{margin:4px 0 0;opacity:.85}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;font-size:13px}
.tbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.main{max-width:1180px;margin:-44px auto 40px;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
.stat b{display:block;font-size:24px;color:var(--brand)}.stat span{color:var(--mute);font-size:13px}
.search{display:flex;gap:10px;margin-bottom:16px}
.search input{flex:1;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;min-width:0}
.search input:focus{outline:2px solid var(--brand2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(20,33,61,.05)}
.card.wide{grid-column:1/-1}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:10px}
.ic{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:17px}
.cnt{margin-left:auto;font-size:12px;color:var(--mute);background:var(--chip);padding:2px 9px;border-radius:999px;font-weight:500}
.sub{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:12px 0 4px}
.list{display:grid;gap:2px}
.wide .list{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px}
a.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none}
a.row:hover{background:var(--hover)}
a.row .t{flex:1;min-width:0}
a.row small{display:block;color:var(--mute);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--brand);white-space:nowrap}
.note{padding:8px 10px;color:var(--mute);font-size:13px}
.empty{text-align:center;color:var(--mute);padding:40px 0;display:none}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 20px 24px}
</style>

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(q){
 q=(q||"").toLowerCase().trim();var h="",n=0,sec=0;
 DATA.forEach(function(s){
  var out="",c=0,pend="";
  s.items.forEach(function(it){
   if(it[0].indexOf("__")===0){pend='<div class="sub">'+esc(it[0].slice(2))+'</div>';return}
   if(!it[1]){if(!q){out+=pend+'<div class="note">'+esc(it[0])+' – link not added yet</div>';pend=""}return}
   if(q&&(it[0]+" "+s.t+" "+it[2]).toLowerCase().indexOf(q)<0)return;
   out+=pend+'<a class="row" href="'+it[1]+'" target="_blank" rel="noopener"><span class="t">'+esc(it[0])+(it[3]?'<small>'+it[3]+'</small>':'')+'</span><span class="tag">'+it[2]+'</span></a>';pend="";c++;
  });
  if(!c)return;n+=c;sec++;
  h+='<section class="card'+(s.w?' wide':'')+'"><h2><span class="ic">'+s.i+'</span>'+esc(s.t)+'<span class="cnt">'+c+'</span></h2><div class="list">'+out+'</div></section>';
 });
 document.getElementById("grid").innerHTML=h;
 document.getElementById("empty").style.display=n?"none":"block";
}

 var a=[[Object.keys(u).length,"Unique links"],[t.Sheet||0,"Sheets"],[t.Doc||0,"Docs"],[(t.Folder||0)+(t.Form||0)+(t.Web||0),"Portals, folders & forms"]];
 document.getElementById("stats").innerHTML=a.map(function(x){return '<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("");
}
